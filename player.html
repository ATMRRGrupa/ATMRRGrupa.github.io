<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LIVE STREAM</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body style="margin:0;background:black;">
<video id="video" controls autoplay style="width:100%;height:100vh;"></video>

<script>
const video = document.getElementById('video');

const OBS = "http://acmfg.pl:8888/obs/index.m3u8";
const FALLBACK = "http://acmfg.pl:8888/fallback/index.m3u8";

let hls = null;
let current = OBS;

// 🔥 sprawdzanie czy stream istnieje (ważne dla 404)
async function checkStream(url) {
  try {
    const res = await fetch(url, { method: "HEAD" });
    return res.ok;
  } catch (e) {
    return false;
  }
}

function load(url) {
  console.log("Loading:", url);

  if (hls) {
    hls.destroy();
    hls = null;
  }

  hls = new Hls({
    lowLatencyMode: true
  });

  hls.loadSource(url);
  hls.attachMedia(video);

  hls.on(Hls.Events.ERROR, async function (event, data) {
    if (data.fatal) {
      console.log("Fatal error -> switching...");

      if (url === OBS) {
        const ok = await checkStream(OBS);

        if (!ok) {
          console.log("OBS 404 -> switching to fallback");
          load(FALLBACK);
        } else {
          // jeśli nie 404 tylko glitch → retry OBS
          setTimeout(() => load(OBS), 2000);
        }

      } else {
        // fallback też padł → wróć do OBS co 5s
        setTimeout(() => load(OBS), 5000);
      }
    }
  });
}

// 🔥 START: zawsze OBS
load(OBS);

// 🔁 co 10 sekund sprawdzaj OBS (jeśli fallback gra)
setInterval(async () => {
  if (current === FALLBACK) {
    const ok = await checkStream(OBS);
    if (ok) {
      console.log("OBS back -> switching");
      current = OBS;
      load(OBS);
    }
  }
}, 10000);

</script>

</body>
</html>
